<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#2b2118;--cream:#faf7f3;--sand:#f1ebe3;--line:#e6ddd2;--gold:#b07a3c;--gold2:#d9a85b;--mut:#6b5844;--red:#b3261e;--grn:#1f7a3d;--blu:#1d5bb8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink)}
.serif{font-family:Georgia,"Times New Roman","Noto Naskh Arabic",serif}
header{background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.5px;margin:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--gold2);transform:rotate(45deg);display:inline-block}
header .sp{flex:1}
.tab{background:none;border:0;color:#d9cbbb;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer}.tab.on{background:#fff;color:var(--ink);font-weight:600}
.lang{display:flex;border:1px solid #6b5844;border-radius:8px;overflow:hidden}.lang button{background:none;border:0;color:#d9cbbb;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}.lang button.on{background:var(--gold);color:#fff}
.who{font-size:13px;color:#d9cbbb}
button.b{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer}
button.l{background:none;border:1px solid #6b5844;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px;margin-inline-start:6px}
main{padding:20px;max-width:1320px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.login{max-width:420px;margin:40px auto}.login select,.login input{width:100%;padding:12px;font:inherit;font-size:16px;border:1px solid #cbbfb0;border-radius:8px;margin:6px 0 12px;background:#fff}
.err{color:var(--red);font-size:14px;min-height:20px}
/* hero */
.hero{background:radial-gradient(ellipse at 85% 0%,rgba(217,168,91,.35),transparent 55%),linear-gradient(135deg,#2b2118,#4a3624);color:#fff;border-radius:20px;padding:48px 36px;margin-bottom:18px;position:relative;overflow:hidden}
.hero .k{color:var(--gold2);letter-spacing:3px;font-size:12px;text-transform:uppercase}
.hero h1{font-family:Georgia,"Noto Naskh Arabic",serif;font-weight:400;font-size:clamp(34px,6vw,60px);margin:10px 0 8px;line-height:1.05}
.hero p{color:#e7dac8;max-width:560px;font-size:16px;line-height:1.55;margin:0}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.nc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:.15s;text-align:start;font:inherit;color:inherit}
.nc:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px rgba(43,33,24,.08)}
.nc .no{font-family:Georgia,serif;color:var(--gold);font-size:28px}.nc b{display:block;font-size:17px;margin:6px 0 4px}.nc span{color:var(--mut);font-size:14px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.kp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.kp b{font-family:Georgia,serif;font-size:30px;display:block;line-height:1}.kp small{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f0e8de;font-size:14px}.li:first-of-type{border-top:0}.li small{color:var(--mut)}
.d{white-space:nowrap;font-weight:700}
.empty{color:var(--mut);font-size:14px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th{text-align:start;background:var(--sand);padding:9px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
td{border-top:1px solid #eee3d8;padding:7px 8px;vertical-align:top}
td.n{font-weight:700;color:#8a7a68;width:52px}td.dep{font-size:12px;color:#8a7a68;width:90px}
input[type=date],select.s,input.c{font:inherit;padding:7px;border:1px solid #cbbfb0;border-radius:6px;background:#fff;max-width:100%}
input.c{width:100%;min-width:150px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.p-af{background:#eee;color:#555}.p-ec{background:#e3edfb;color:var(--blu)}.p-t{background:#e3f4e8;color:var(--grn)}.p-b{background:#fde5e3;color:var(--red)}
.late td.dl{color:var(--red);font-weight:700}.ok{color:var(--grn);font-size:12px;margin-inline-start:6px;opacity:0;transition:opacity .3s}.ok.show{opacity:1}
.tl{font-size:12px;color:var(--mut);font-style:italic;margin-top:3px}.tl:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.pc b{font-size:15px}
.bar{height:8px;background:#eee3d8;border-radius:5px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.pc small{display:block;color:var(--mut);margin-top:3px}.red{color:var(--red);font-weight:600}.amb{color:#a46b00;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.filters select{padding:8px;border:1px solid #cbbfb0;border-radius:8px;font:inherit;background:#fff}
.hint{color:var(--mut);font-size:14px;margin:0 0 12px;line-height:1.5}.scroll{overflow-x:auto}
/* gantt */
.gw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:75vh}
.gh{position:sticky;top:0;z-index:6;background:#fff}
.gl{position:sticky;left:0;z-index:4;width:290px;min-width:290px;background:#fff;border-inline-end:1px solid var(--line);padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start;font-size:13px}
.gr{display:flex;height:30px;align-items:center;border-top:1px solid #f3ece3;position:relative;z-index:2}
.gr.ph{background:#fbf8f4;font-weight:700;cursor:pointer;height:36px}.gr.ph .gl{background:#fbf8f4}
.gt{position:relative;height:100%;flex:none}
.gmo{display:flex;height:24px;border-bottom:1px solid var(--line)}.gmo div,.gdy div{flex:none;font-size:11px;color:var(--mut);text-align:center;border-inline-start:1px solid #f0e8de;overflow:hidden;white-space:nowrap}
.gmo div{font-weight:700;color:var(--ink);text-align:start;padding:5px 6px;text-transform:capitalize}.gdy{display:flex;height:22px;line-height:22px}
.gdy div.we,.we-bg{background:rgba(176,122,60,.09)}
.gov{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none}.gov i{position:absolute;top:0;bottom:0;background:rgba(176,122,60,.07)}
.gov b{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3}
.gbar{position:absolute;top:7px;height:16px;border-radius:5px;display:flex;align-items:center;font-size:10px;color:#fff;padding:0 4px;overflow:hidden}
.gbar.af{background:#a9b6c9}.gbar.ec{background:var(--blu)}.gbar.t{background:#6cb585}.gbar.b{background:var(--red)}.gbar.lt{box-shadow:0 0 0 2px var(--red)}
.gbar.sum{top:11px;height:14px;background:#d8c8b3;border-radius:4px}.gbar.sum i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.gms{position:absolute;top:8px;width:14px;height:14px;background:var(--gold);transform:rotate(45deg);border-radius:2px}
.gbl{position:absolute;top:7px;font-size:11px;color:var(--mut);white-space:nowrap;line-height:16px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 10px;align-items:center}.leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

.gate{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:10px}
.gcard{width:100%;max-width:520px;background:radial-gradient(ellipse at 85% 0%,rgba(217,168,91,.35),transparent 55%),linear-gradient(135deg,#2b2118,#4a3624);color:#fff;border-radius:22px;padding:42px 34px;box-shadow:0 20px 50px rgba(43,33,24,.25)}
.gcard .k{color:var(--gold2);letter-spacing:3px;font-size:12px;text-transform:uppercase}
.gcard h1{font-family:Georgia,"Noto Naskh Arabic",serif;font-weight:400;font-size:clamp(28px,5vw,40px);margin:10px 0 6px;line-height:1.1}
.gcard p{color:#e7dac8;margin:0 0 22px;font-size:15px;line-height:1.5}
.gcard select,.gcard input{width:100%;padding:13px;font:inherit;font-size:16px;border:0;border-radius:10px;margin:0 0 12px;background:#fff;color:var(--ink)}
.gcard .err{color:#ffb4ab}
.alert{background:#fff7e8;border:1px solid #ecd3a3;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.alert b{color:#8a5a00}.alert ul{margin:8px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.55}
.cohg{margin-bottom:16px}.cohg h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cohg .btns button{background:#fff;border:1px solid #cbbfb0;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;margin-inline-end:6px}
.cohg .btns button:hover{border-color:var(--gold)}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-inline-start:5px}
.sev{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-inline-end:6px;background:#fde5e3;color:var(--red)}.sev.w{background:#fff1d6;color:#8a5a00}
footer{text-align:center;color:#9a8b78;font-size:12px;padding:24px}
@media(max-width:700px){td.dep,th.dep{display:none}.hero{padding:32px 22px}main{padding:14px}.gl{width:170px;min-width:170px}}

 try{const kb=await rpc('mgmt_vault_key',{p_who:me.who,p_pin:me.pin});

  const key=await crypto.subtle.importKey('raw',b64(kb),'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:enc.slice(0,12)},key,enc.slice(12)));
  const sr=await rpc('mgmt_state_get',{p_who:me.who,p_pin:me.pin});
  const boot={url:URL_,key:KEY,who:me.who,pin:me.pin,lang:lang==='en'?'en':'fr',state:sr?sr.data:null,version:sr?sr.version:0};

 ow.forEach(w=>{const q=all.filter(i=>i.o===w);const ne=q.filter(i=>i.sev==='e').length;h+=`<div class="card cohg"><h2>${esc(pnm(w))} <span class="badge">${ne}</span> <small style="font-weight:400;color:var(--mut)">${L('sev_e')} · ${q.length-ne} ${L('sev_w')}</small></h2>${cohList(q)}${w!=='Direction'?`<div class="btns" style="margin-top:10px">${['fr','en','ar'].map(l=>`<button onclick="cohCopy('${w}','${l}')">${L('coh_copy')} · ${l.toUpperCase()}</button>`).join('')}${['fr','en','ar'].map(l=>`<button onclick="cohWa('${w}','${l}')">${L('coh_wa')} · ${l.toUpperCase()}</button>`).join('')}</div>`:''}</div>`});
 return h}
function cohAlert(){if(!me)return '';const q=COH().filter(i=>isAdmin()?true:i.o===me.who);if(!q.filter(i=>i.sev==='e').length&&isAdmin())return '';if(!q.length)return '';
 return isAdmin()?`<div class="alert"><b>⚠ ${L('coh_all',{n:q.filter(i=>i.sev==='e').length})}</b> <a href="#" onclick="go('coh');return false">→</a></div>`:`<div class="alert"><b>⚠ ${L('coh_my',{n:q.length})}</b>${cohList(q)}</div>`}
/* chrome */
function head(){const tabs=me?[['home','tab_home'],['me','tab_me'],['all','tab_all'],['gantt','tab_gantt']]:[];if(isAdmin()){tabs.push(['plan','tab_plan']);tabs.push(['coh','tab_coh']);}
 document.getElementById('tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab${tab===k?' on':''}" onclick="go('${k}')">${L(l)}${k==='coh'&&COH().filter(i=>i.sev==='e').length?`<span class="badge">${COH().filter(i=>i.sev==='e').length}</span>`:''}</button>`).join('');
 document.getElementById('bt').textContent=L('brand');document.getElementById('ft').textContent=L('ft');
 document.getElementById('who').innerHTML=me?esc(pnm(me.who))+` <button class="l" onclick="out()">${L('change')}</button>`:'';
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'}
function go(t){tab=t;render();window.scrollTo(0,0)}
function out(){localStorage.removeItem('olba-mgmt-me');me=null;tab='home';planLoaded=false;document.getElementById('pl').innerHTML='';render()}
function setLang(l){lang=l;try{localStorage.setItem('olba-lang',l)}catch(e){}render()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
/* login */
async function login(){const w=document.getElementById('lw').value,p=document.getElementById('lp').value.trim().toUpperCase();
 const e=document.getElementById('le');e.textContent='';if(!w||!p){e.textContent=L('need');return}
 try{const ok=await rpc('mgmt_check',{p_who:w,p_pin:p});if(!ok){e.textContent=L('bad_pin');return}
 me={who:w,pin:p};localStorage.setItem('olba-mgmt-me',JSON.stringify(me));tab='home';render();window.scrollTo(0,0)}catch(x){e.textContent=L('conn')}}
function loginView(){return `<div class="gate"><div class="gcard"><div class="k">OLBA Bakehouse</div><h1>${L('gate_t')}</h1><p>${L('gate_s')}</p>
<select id="lw"><option value="">${L('my_name')}</option>${PEOPLE.map(p=>`<option value="${p}">${esc(pnm(p))}</option>`).join('')}</select>
<input id="lp" placeholder="${L('my_code')}" autocomplete="off" dir="ltr" onkeydown="if(event.key==='Enter')login()"><div class="err" id="le"></div>
<button class="b" style="width:100%" onclick="login()">${L('enter')}</button></div></div>`}
/* save */
async function save(id,el){const row=el.closest('tr');const g=c=>row.querySelector('.'+c);
 const dl=g('i-dl').value||null,s=g('i-st').value,c=g('i-c').value.slice(0,500);const ok=row.querySelector('.ok');
 try{await rpc('mgmt_set',{p_id:id,p_who:me.who,p_pin:me.pin,p_deadline:dl,p_status:s,p_comment:c});S[id]={...st(id),deadline:dl,status:s,comment:c};
 ok.textContent=L('saved');ok.style.color='';ok.classList.add('show');setTimeout(()=>ok.classList.remove('show'),1800);row.classList.toggle('late',!!isLate(T.find(t=>t.id===id)));fillTr()}
 catch(e){ok.textContent=L('err');ok.style.color='#b3261e';ok.classList.add('show')}}
function rowEdit(t,editable){const x=st(t.id);
 const dl=editable?`<input type="date" class="i-dl" value="${x.deadline||''}" onchange="save('${t.id}',this)">`:fd(x.deadline);
 const ss=editable?`<select class="s i-st" onchange="save('${t.id}',this)">${STAT.map(s=>`<option value="${s}"${s===x.status?' selected':''}>${stl(s)}</option>`).join('')}</select>`:`<span class="pill ${PC[x.status]}">${stl(x.status)}</span>`;
 const cm=editable?`<input class="c i-c" value="${esc(x.comment)}" maxlength="500" placeholder="${L('cph')}" onchange="save('${t.id}',this)">`:esc(x.comment);
 return `<tr class="${isLate(t)?'late':''}"><td class="n">${t.id}</td><td>${esc(tn(t))}</td><td class="dep">${esc(t.dep)}</td><td class="dl">${dl}</td><td>${ss}</td><td>${cm}<span class="ok"></span><div class="tl" data-id="${t.id}"></div></td></tr>`}
const thead=(o)=>`<thead><tr><th>${L('th_id')}</th><th>${L('th_a')}</th><th class="dep">${L('th_dep')}</th><th>${L('th_dl')}</th><th>${L('th_s')}</th><th>${L('th_c')}</th>${o?`<th>${L('th_o')}</th>`:''}</tr></thead>`;
/* home */
function homeView(){const projs=Object.keys(PJ).filter(p=>T.some(t=>t.p===p));
 const n=T.length,open=T.filter(t=>st(t.id).status!=='Terminé'),done=n-open.length,doing=T.filter(t=>st(t.id).status==='En cours').length,
  late=T.filter(isLate),nodl=open.filter(t=>!st(t.id).deadline).length,bl=T.filter(t=>st(t.id).status==='Bloqué').length,td=today();
 const ops=T.filter(t=>/OP$/.test(t.id)&&st(t.id).status!=='Terminé').map(t=>({t,d:endOf(t)})).sort((a,b)=>a.d<b.d?-1:1);
 const nxt=open.filter(t=>st(t.id).deadline&&st(t.id).deadline>=td&&dd(st(t.id).deadline,td)<=7).sort((a,b)=>st(a.id).deadline<st(b.id).deadline?-1:1);
 const li=(t,d,c)=>`<div class="li"><span>${esc(tn(t))}<br><small>${esc(pj(t.p))} · ${esc(pnm(t.o))}</small></span><span class="d ${c||''}">${fd(d)}</span></div>`;
 return cohAlert()+`<div class="hero"><div class="k">OLBA Bakehouse · ${L('k')}</div><h1>${L('h_t')}</h1><p>${L('h_s',{p:projs.length,n})}</p></div>
 <div class="nav">${[['me','c_me','c_med','01'],['all','c_all','c_alld','02'],['gantt','c_g','c_gd','03']].map(([k,a,b,no])=>`<button class="nc" onclick="go('${k}')"><div class="no">${no}</div><b>${L(a)}</b><span>${L(b)}</span></button>`).join('')}</div>
 <div class="kpis">${[[n,'k_tot',''],[done,'k_done','grn'],[doing,'k_doing',''],[late.length,'k_late',late.length?'red':''],[nodl,'k_nodl',nodl?'amb':''],[bl,'k_bl',bl?'red':'']].map(([v,l,c])=>`<div class="kp"><b class="${c}">${v}</b><small>${L(l)}</small></div>`).join('')}</div>
 <div class="two"><div class="card"><h3>${L('s_open')}</h3>${ops.map(o=>{const k=dd(o.d,td);return `<div class="li"><span>${esc(pj(o.t.p))}</span><span class="d">${fd(o.d)} <small>${k>=0?L('left',{n:k}):L('past')}</small></span></div>`}).join('')||`<div class="empty">${L('none')}</div>`}</div>
 <div class="card"><h3>${L('s_late')} (${late.length})</h3>${late.slice(0,8).map(t=>li(t,st(t.id).deadline,'red')).join('')||`<div class="empty">${L('none')}</div>`}</div>
 <div class="card"><h3>${L('s_next')} (${nxt.length})</h3>${nxt.slice(0,10).map(t=>li(t,st(t.id).deadline)).join('')||`<div class="empty">${L('none')}</div>`}</div></div>`}
/* me */
function meView(){if(!me)return loginView();
 const mine=T.filter(t=>t.o===me.who),ps=[...new Set(mine.map(t=>t.p))];
 const open=mine.filter(t=>st(t.id).status!=='Terminé').length,nodl=mine.filter(t=>!st(t.id).deadline&&st(t.id).status!=='Terminé').length;
 let h=cohAlert()+`<div class="card"><h2 class="serif">${L('hello',{w:esc(pnm(me.who))})}</h2><p class="hint">${L('mysum',{n:mine.length,o:open})} ${nodl?`<span class="amb">${L('mynodl',{n:nodl})}</span>`:L('myok')} ${L('auto')}${isAdmin()?L('adm'):''}</p></div>`;
 ps.forEach(p=>{h+=`<div class="card"><h2>${esc(pj(p))}</h2><div class="scroll"><table>${thead()}<tbody>${mine.filter(t=>t.p===p).map(t=>rowEdit(t,true)).join('')}</tbody></table></div></div>`});return h}
/* overview */
function allView(){const projs=[...new Set(T.map(t=>t.p))];
 let h=`<div class="grid">`+projs.map(p=>{const Q=T.filter(t=>t.p===p),d=Q.filter(t=>st(t.id).status==='Terminé').length,
  nd=Q.filter(t=>!st(t.id).deadline&&st(t.id).status!=='Terminé').length,lt=Q.filter(isLate).length,bl=Q.filter(t=>st(t.id).status==='Bloqué').length;
  const nx=Q.filter(t=>st(t.id).deadline&&st(t.id).status!=='Terminé').map(t=>st(t.id).deadline).sort()[0];
  return `<div class="pc"><b>${esc(pj(p))}</b><div class="bar"><i style="width:${Math.round(d/Q.length*100)}%"></i></div><small>${L('p_d',{d,n:Q.length})}</small>
  <small class="${lt?'red':''}">${L('p_l',{n:lt})}</small><small class="${bl?'red':''}">${L('p_b',{n:bl})}</small><small class="${nd?'amb':''}">${L('p_n',{n:nd})}</small><small>${L('p_x',{d:fd(nx)})}</small></div>`}).join('')+`</div>`;
 const sel=(k,arr,lab,nm)=>`<select onchange="fl.${k}=this.value;render()"><option value="">${lab}</option>${arr.map(a=>`<option value="${esc(a)}"${fl[k]===a?' selected':''}>${esc(nm(a))}</option>`).join('')}</select>`;
 h+=`<div class="filters">${sel('p',projs,L('f_p'),pj)}${sel('o',PEOPLE,L('f_o'),pnm)}${sel('s',STAT,L('f_s'),stl)}
 <label><input type="checkbox" ${fl.late?'checked':''} onchange="fl.late=this.checked;render()"> ${L('f_late')}</label>
 <label><input type="checkbox" ${fl.nodl?'checked':''} onchange="fl.nodl=this.checked;render()"> ${L('f_nodl')}</label></div>`;
 const Q=T.filter(t=>(!fl.p||t.p===fl.p)&&(!fl.o||t.o===fl.o)&&(!fl.s||st(t.id).status===fl.s)&&(!fl.late||isLate(t))&&(!fl.nodl||(!st(t.id).deadline&&st(t.id).status!=='Terminé')));
 const ed=isAdmin();
 h+=`<div class="card"><p class="hint">${L('cnt',{n:Q.length})}${ed?L('edit'):''}</p><div class="scroll"><table>${thead(1)}<tbody>`+
 Q.map(t=>rowEdit(t,ed).replace('</tr>',`<td>${esc(pnm(t.o))}</td></tr>`)).join('')+`</tbody></table></div></div>`;return h}
/* gantt */
function ganttView(){const projs=[...new Set(T.map(t=>t.p))],td=today(),dw=22,LW=window.innerWidth<700?170:290;
 const Q=T.filter(t=>(!gf.p||t.p===gf.p)&&(!gf.o||t.o===gf.o));
 const span=t=>{const x=st(t.id);if(x.status==='Terminé'){const e=t.e<t.s?t.e:t.s;return[e,e]}const e=endOf(t);return[t.s>e?e:t.s,e]};
 let mn=td,mx=td;Q.forEach(t=>{const[a,b]=span(t);if(a<mn)mn=a;if(b>mx)mx=b});
 const D0=U(mn)-864e5,days=Math.round((U(mx)-D0)/864e5)+3,W=days*dw,X=s=>Math.round((U(s)-D0)/864e5)*dw;
 const loc=lang==='ar'?'ar-u-ca-gregory-nu-latn':lang==='en'?'en-GB':'fr-FR';const mf=new Intl.DateTimeFormat(loc,{month:'long',year:'numeric',timeZone:'UTC'});
 let mo='',dy='',cur=null,cw=0,ml='';const flush=()=>{if(cur!==null)mo+=`<div style="width:${cw*dw}px">${ml}</div>`};
 for(let i=0;i<days;i++){const d=new Date(D0+i*864e5),k=d.getUTCFullYear()*12+d.getUTCMonth();if(k!==cur){flush();cur=k;cw=0;ml=mf.format(d)}cw++;
  const w=d.getUTCDay();dy+=`<div class="${w===5||w===6?'we':''}" style="width:${dw}px">${d.getUTCDate()}</div>`}flush();
 let ov='';for(let i=0;i<days;i++){const w=new Date(D0+i*864e5).getUTCDay();if(w===5||w===6)ov+=`<i style="left:${i*dw}px;width:${dw}px"></i>`}
 const tx=X(td)+dw/2;ov+=`<b style="left:${tx}px"></b>`;
 const lab=(c,t)=>`<div class="gl" title="${esc(t||c)}">${c}</div>`;
 let rows='';projs.filter(p=>Q.some(t=>t.p===p)).forEach(p=>{const P=Q.filter(t=>t.p===p);
  const sp=P.map(span),a=sp.map(s=>s[0]).sort()[0],b=sp.map(s=>s[1]).sort().pop();
  const dn=P.filter(t=>st(t.id).status==='Terminé').length,open=exp[p]||gf.o||gf.p;
  const op=P.find(t=>/OP$/.test(t.id));
  rows+=`<div class="gr ph" onclick="exp['${esc(p)}']=!exp['${esc(p)}'];render()">${lab((open?'▾ ':'▸ ')+esc(pj(p))+` · ${dn}/${P.length}`)}<div class="gt" style="width:${W}px"><div class="gbar sum" style="left:${X(a)}px;width:${X(b)-X(a)+dw-2}px"><i style="width:${Math.round(dn/P.length*100)}%"></i></div>${op?`<div class="gms" style="left:${X(endOf(op))+3}px" title="${L('l_ms')} ${fd(endOf(op))}"></div>`:''}</div></div>`;
  if(open)P.forEach(t=>{const x=st(t.id),[s,e]=span(t),ms=/(GO|OP)$/.test(t.id)&&t.ms,late=isLate(t);
   const tip=`${t.id} · ${tn(t)}\n${pnm(t.o)} · ${stl(x.status)}\n${fd(s)} → ${fd(e)}${x.deadline?'':' *'}`;
   const bar=ms?`<div class="gms" style="left:${X(e)+3}px" title="${esc(tip)}"></div>`:`<div class="gbar ${GC[x.status]}${late?' lt':''}" style="left:${X(s)}px;width:${X(e)-X(s)+dw-2}px" title="${esc(tip)}"></div>`;
   const bx=ms?X(e)+24:X(e)+dw+4;
   rows+=`<div class="gr">${lab(`<span style="color:#8a7a68">${t.id}</span> ${esc(tn(t))}`,tip)}<div class="gt" style="width:${W}px">${bar}<span class="gbl" style="left:${bx}px">${esc(pnm(t.o))} · ${fd(e)}</span></div></div>`})});
 const sel=(k,arr,lab,nm)=>`<select onchange="gf.${k}=this.value;render()"><option value="">${lab}</option>${arr.map(a=>`<option value="${esc(a)}"${gf[k]===a?' selected':''}>${esc(nm(a))}</option>`).join('')}</select>`;
 return `<div class="card" style="padding:14px"><p class="hint" style="margin-bottom:10px">${L('g_hint')}</p>
 <div class="filters">${sel('p',projs,L('f_p'),pj)}${sel('o',PEOPLE,L('f_o'),pnm)}<button class="b" style="padding:7px 12px;font-size:13px" onclick="projs_.forEach(p=>exp[p]=true);render()">${L('g_exp')}</button><button class="b" style="padding:7px 12px;font-size:13px;background:#8a7a68" onclick="exp={};gf.p='';gf.o='';render()">${L('g_col')}</button></div>
 <div class="leg"><span><i style="background:#a9b6c9"></i>${L('l_af')}</span><span><i style="background:var(--blu)"></i>${L('l_ec')}</span><span><i style="background:#6cb585"></i>${L('l_t')}</span><span><i style="background:var(--red)"></i>${L('l_b')}</span><span><i style="background:#fff;box-shadow:0 0 0 2px var(--red)"></i>${L('l_lt')}</span><span><i style="background:var(--gold);width:10px;height:10px;transform:rotate(45deg)"></i>${L('l_ms')}</span></div>
 <div class="gw" dir="ltr" data-tx="${tx}"><div style="width:${LW+W}px"><div class="gh"><div class="gmo"><div class="gl" style="border:0;height:24px;padding:0"></div><div style="width:${W}px;display:flex;border:0;padding:0;text-align:start">${mo}</div></div>
 <div class="gdy"><div class="gl" style="border:0;padding:0"></div><div style="width:${W}px;display:flex;border:0;padding:0">${dy}</div></div></div>
 <div style="position:relative"><div class="gov" style="left:${LW}px;width:${W}px">${ov}</div>${rows}</div></div></div></div>`}
const projs_=[...new Set(T.map(t=>t.p))];
function render(){head();const m=document.getElementById('m');const pl=document.getElementById('pl');
 if(tab==='plan'&&isAdmin()){m.style.display='none';pl.style.display='block';openPlan();return}
 m.style.display='';pl.style.display='none';
 if(!me){m.innerHTML=loginView();return}
 const keep=document.querySelector('.gw');const sl=keep?[keep.scrollLeft,keep.scrollTop]:null;
 m.innerHTML=tab==='home'?homeView():tab==='me'?meView():tab==='all'?allView():tab==='coh'&&isAdmin()?cohView():ganttView();
 const g=document.querySelector('.gw');if(g){if(sl){g.scrollLeft=sl[0];g.scrollTop=sl[1]}else{g.scrollLeft=Math.max(0,(+g.dataset.tx||0)-180)}}
 fillTr()}
(async()=>{render();await load();render();
 setInterval(async()=>{if(document.hidden)return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='checkbox')return;if(tab==='plan'||!me)return;if(await load())render()},30000)})();
</script></body></html>
