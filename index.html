<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#faf7f3;color:#2b2118}
header{background:#2b2118;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:.3px}header .sp{flex:1}
.tab{background:none;border:0;color:#d9cbbb;font-size:15px;padding:8px 12px;border-radius:8px;cursor:pointer}.tab.on{background:#fff;color:#2b2118;font-weight:600}
.who{font-size:13px;color:#d9cbbb}.who button{margin-left:8px}
button.b{background:#b07a3c;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer}
button.l{background:none;border:1px solid #d9cbbb;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12px}
main{padding:18px 20px;max-width:1300px;margin:0 auto}
.card{background:#fff;border:1px solid #e6ddd2;border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:18px 0 8px;color:#6b5844}
.login{max-width:420px;margin:40px auto}.login select,.login input{width:100%;padding:12px;font-size:16px;border:1px solid #cbbfb0;border-radius:8px;margin:6px 0 12px;background:#fff}
.err{color:#b3261e;font-size:14px;min-height:20px}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th{text-align:left;background:#f1ebe3;padding:9px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#6b5844}
td{border-top:1px solid #eee3d8;padding:7px 8px;vertical-align:middle}
td.n{font-weight:700;color:#8a7a68;width:52px}td.dep{font-size:12px;color:#8a7a68;width:90px}
input[type=date],select.s,input.c{font:inherit;padding:7px;border:1px solid #cbbfb0;border-radius:6px;background:#fff;max-width:100%}
input.c{width:100%;min-width:140px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
.p-af{background:#eee;color:#555}.p-ec{background:#e3edfb;color:#1d5bb8}.p-t{background:#e3f4e8;color:#1f7a3d}.p-b{background:#fde5e3;color:#b3261e}
.late td.dl{color:#b3261e;font-weight:700}.ok{color:#1f7a3d;font-size:12px;margin-left:6px;opacity:0;transition:opacity .3s}.ok.show{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:16px}
.pc{background:#fff;border:1px solid #e6ddd2;border-radius:12px;padding:14px}.pc b{font-size:15px}
.bar{height:8px;background:#eee3d8;border-radius:5px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:#1f7a3d}
.pc small{display:block;color:#6b5844;margin-top:3px}.red{color:#b3261e;font-weight:600}.amb{color:#a46b00;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.filters select{padding:8px;border:1px solid #cbbfb0;border-radius:8px;font:inherit;background:#fff}
.hint{color:#6b5844;font-size:14px;margin:0 0 12px}
.scroll{overflow-x:auto}
@media(max-width:700px){td.dep,th.dep{display:none}}

) — costing et prix de vente","o":"Chef Omar","dep":"C36","dl":"2026-11-15","st":"À faire"},{"p":"Celebration Cakes","id":"C38","n":"Pistachio Cake (hiver) (nouveau) — fiche technique et SOP","o":"Chef Omar","dep":"C37","dl":"2026-11-16","st":"À faire"},{"p":"Celebration Cakes","id":"C39","n":"Posts des gâteaux (photos existantes, puis photos des boîtes)","o":"Rima","dep":"C5","dl":null,"st":"À faire"},{"p":"Celebration Cakes","id":"C40","n":"Shooting des boîtes (à programmer avec le photographe)","o":"Rima","dep":"C6","dl":null,"st":"À faire"},{"p":"Pizzeria / Pizza Terrace","id":"P21","n":"Design du packaging pizza","o":"Rima","dep":"","dl":"2026-11-16","st":"En cours"}];
const STAT=['À faire','En cours','Terminé','Bloqué'],PC={'À faire':'p-af','En cours':'p-ec','Terminé':'p-t','Bloqué':'p-b'};
const PEOPLE=['Rima','Chef Omar','Sayed','Hafiz','Consultant pizza','Direction'];
let S={},me=null,tab='me',fl={p:'',o:'',s:'',late:false,nodl:false},busy=false;
try{me=JSON.parse(localStorage.getItem('olba-mgmt-me')||'null')}catch(e){}
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fd=s=>s?s.split('-').reverse().join('/'):'—';
async function load(){try{const r=await fetch(URL_+'/rest/v1/mgmt_tasks?select=id,deadline,status,comment,updated_by',{headers:H});if(!r.ok)throw 0;(await r.json()).forEach(x=>S[x.id]=x);return true}catch(e){return false}}
async function rpc(fn,b){const r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json()}
const st=id=>S[id]||{deadline:null,status:'À faire',comment:''};
const isLate=t=>{const x=st(t.id);return x.deadline&&x.deadline<today()&&x.status!=='Terminé'};
const isAdmin=()=>me&&me.who==='Direction';
function head(){document.getElementById('who').innerHTML=me?esc(me.who)+' <button class="l" onclick="out()">Changer</button>':'';
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function out(){localStorage.removeItem('olba-mgmt-me');me=null;tab='me';render()}
async function login(){const w=document.getElementById('lw').value,p=document.getElementById('lp').value.trim().toUpperCase();
 const e=document.getElementById('le');e.textContent='';if(!w||!p){e.textContent='Choisis ton nom et saisis ton code.';return}
 try{const ok=await rpc('mgmt_check',{p_who:w,p_pin:p});if(!ok){e.textContent='Code incorrect.';return}
 me={who:w,pin:p};localStorage.setItem('olba-mgmt-me',JSON.stringify(me));render()}catch(x){e.textContent='Connexion impossible. Réessaie.'}}
function loginView(){return `<div class="card login"><h2>Connexion</h2><p class="hint">Choisis ton nom et saisis le code personnel reçu de Abdelhafid.</p>
<select id="lw"><option value="">— Mon nom —</option>${PEOPLE.map(p=>`<option>${p}</option>`).join('')}</select>
<input id="lp" placeholder="Mon code" autocomplete="off" onkeydown="if(event.key==='Enter')login()"><div class="err" id="le"></div>
<button class="b" onclick="login()">Entrer</button><p class="hint" style="margin-top:16px"><a href="#" onclick="tab='all';render();return false">Voir la vue d'ensemble sans me connecter</a></p></div>`}
async function save(id,el){const row=el.closest('tr');const g=c=>row.querySelector('.'+c);
 const dl=g('i-dl').value||null,s=g('i-st').value,c=g('i-c').value.slice(0,500);
 const ok=row.querySelector('.ok');
 try{await rpc('mgmt_set',{p_id:id,p_who:me.who,p_pin:me.pin,p_deadline:dl,p_status:s,p_comment:c});S[id]={...st(id),deadline:dl,status:s,comment:c};
 ok.textContent='Enregistré ✓';ok.classList.add('show');setTimeout(()=>ok.classList.remove('show'),1800);row.classList.toggle('late',isLate(T.find(t=>t.id===id)))}
 catch(e){ok.textContent='Erreur';ok.style.color='#b3261e';ok.classList.add('show')}}
function rowEdit(t,editable){const x=st(t.id);
 const dl=editable?`<input type="date" class="i-dl" value="${x.deadline||''}" onchange="save('${t.id}',this)">`:fd(x.deadline);
 const ss=editable?`<select class="s i-st" onchange="save('${t.id}',this)">${STAT.map(s=>`<option${s===x.status?' selected':''}>${s}</option>`).join('')}</select>`:`<span class="pill ${PC[x.status]}">${x.status}</span>`;
 const cm=editable?`<input class="c i-c" value="${esc(x.comment)}" maxlength="500" placeholder="Commentaire" onchange="save('${t.id}',this)">`:esc(x.comment);
 return `<tr class="${isLate(t)?'late':''}"><td class="n">${t.id}</td><td>${esc(t.n)}</td><td class="dep">${esc(t.dep)}</td><td class="dl">${dl}</td><td>${ss}</td><td>${cm}<span class="ok"></span></td></tr>`}
const THEAD=(o)=>`<thead><tr><th>N°</th><th>Action</th><th class="dep">Dépend de</th><th>Deadline</th><th>Statut</th><th>Commentaire</th></tr></thead>`;
function meView(){if(!me)return loginView();
 const mine=T.filter(t=>t.o===me.who);const ps=[...new Set(mine.map(t=>t.p))];
 const open=mine.filter(t=>st(t.id).status!=='Terminé').length,nodl=mine.filter(t=>!st(t.id).deadline&&st(t.id).status!=='Terminé').length;
 let h=`<div class="card"><h2>Bonjour ${esc(me.who)}</h2><p class="hint">${mine.length} actions à ton nom, ${open} à faire. ${nodl?`<span class="amb">${nodl} sans deadline : à compléter.</span>`:'Toutes tes deadlines sont renseignées.'} Chaque changement s'enregistre tout seul.${isAdmin()?' Tu peux tout modifier dans « Vue d\'ensemble ».':''}</p></div>`;
 ps.forEach(p=>{h+=`<div class="card"><h2>${esc(p)}</h2><div class="scroll"><table>${THEAD()}<tbody>${mine.filter(t=>t.p===p).map(t=>rowEdit(t,true)).join('')}</tbody></table></div></div>`});
 return h}
function allView(){const projs=[...new Set(T.map(t=>t.p))];
 let h=`<div class="grid">`+projs.map(p=>{const L=T.filter(t=>t.p===p),d=L.filter(t=>st(t.id).status==='Terminé').length,
  nd=L.filter(t=>!st(t.id).deadline&&st(t.id).status!=='Terminé').length,lt=L.filter(isLate).length,bl=L.filter(t=>st(t.id).status==='Bloqué').length;
  const nx=L.filter(t=>st(t.id).deadline&&st(t.id).status!=='Terminé').map(t=>st(t.id).deadline).sort()[0];
  return `<div class="pc"><b>${esc(p)}</b><div class="bar"><i style="width:${Math.round(d/L.length*100)}%"></i></div><small>${d}/${L.length} terminées</small>
  <small class="${lt?'red':''}">${lt} en retard</small><small class="${bl?'red':''}">${bl} bloquées</small><small class="${nd?'amb':''}">${nd} sans deadline</small><small>Prochaine deadline : ${fd(nx)}</small></div>`}).join('')+`</div>`;
 const sel=(k,arr,lab)=>`<select onchange="fl.${k}=this.value;render()"><option value="">${lab}</option>${arr.map(a=>`<option${fl[k]===a?' selected':''}>${a}</option>`).join('')}</select>`;
 h+=`<div class="filters">${sel('p',projs,'Tous les projets')}${sel('o',PEOPLE,'Tous les responsables')}${sel('s',STAT,'Tous les statuts')}
 <label><input type="checkbox" ${fl.late?'checked':''} onchange="fl.late=this.checked;render()"> En retard</label>
 <label><input type="checkbox" ${fl.nodl?'checked':''} onchange="fl.nodl=this.checked;render()"> Sans deadline</label></div>`;
 const L=T.filter(t=>(!fl.p||t.p===fl.p)&&(!fl.o||t.o===fl.o)&&(!fl.s||st(t.id).status===fl.s)&&(!fl.late||isLate(t))&&(!fl.nodl||(!st(t.id).deadline&&st(t.id).status!=='Terminé')));
 const ed=isAdmin();
 h+=`<div class="card"><p class="hint">${L.length} actions${ed?' · tu peux modifier toutes les lignes.':'.'}</p><div class="scroll"><table><thead><tr><th>N°</th><th>Action</th><th class="dep">Dépend de</th><th>Deadline</th><th>Statut</th><th>Commentaire</th><th>Resp.</th></tr></thead><tbody>`+
 L.map(t=>rowEdit(t,ed).replace('</tr>',`<td>${esc(t.o)}</td></tr>`)).join('')+`</tbody></table></div></div>`;return h}
function render(){head();const m=document.getElementById('m');m.innerHTML=tab==='me'?meView():allView()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
(async()=>{render();await load();render();
 setInterval(async()=>{if(document.hidden)return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&a.type!=='checkbox')return;if(await load())render()},30000)})();
</script></body></html>
