<!DOCTYPE html>
<html lang="fr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>OLBA Management</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#2b2118"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OLBA"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--ink:#2b2118;--cream:#faf7f3;--sand:#f1ebe3;--line:#e6ddd2;--gold:#b07a3c;--gold2:#d9a85b;--mut:#6b5844;--red:#b3261e;--grn:#1f7a3d;--blu:#1d5bb8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink)}
.serif{font-family:Georgia,"Times New Roman","Noto Naskh Arabic",serif}
header{background:var(--ink);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.5px;margin:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--gold2);transform:rotate(45deg);display:inline-block}
header .sp{flex:1}#ambbar{position:absolute;left:0;right:0;top:100%;z-index:30}
.tab{white-space:nowrap;background:none;border:0;color:#d9cbbb;font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;cursor:pointer}.tab.on{background:#fff;color:var(--ink);font-weight:600}
.lang{display:flex;border:1px solid #6b5844;border-radius:8px;overflow:hidden}.lang button{background:none;border:0;color:#d9cbbb;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}.lang button.on{background:var(--gold);color:#fff}
.who{font-size:13px;color:#d9cbbb}
button.b{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-size:15px;cursor:pointer}
button.l{background:none;border:1px solid #6b5844;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px;margin-inline-start:6px}
main{padding:20px;max-width:1320px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.login{max-width:420px;margin:40px auto}.login select,.login input{width:100%;padding:12px;font:inherit;font-size:16px;border:1px solid #cbbfb0;border-radius:8px;margin:6px 0 12px;background:#fff}
.err{color:var(--red);font-size:14px;min-height:20px}
/* hero */
.hero{background:radial-gradient(ellipse at 85% 0%,rgba(217,168,91,.35),transparent 55%),linear-gradient(135deg,#2b2118,#4a3624);color:#fff;border-radius:20px;padding:48px 36px;margin-bottom:18px;position:relative;overflow:hidden}
.hero .k{color:var(--gold2);letter-spacing:3px;font-size:12px;text-transform:uppercase}
.hero h1{font-family:Georgia,"Noto Naskh Arabic",serif;font-weight:400;font-size:clamp(34px,6vw,60px);margin:10px 0 8px;line-height:1.05}
.hero p{color:#e7dac8;max-width:560px;font-size:16px;line-height:1.55;margin:0}
.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.nc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:.15s;text-align:start;font:inherit;color:inherit}
.nc:hover{transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px rgba(43,33,24,.08)}
.nc .no{font-family:Georgia,serif;color:var(--gold);font-size:28px}.nc b{display:block;font-size:17px;margin:6px 0 4px}.nc span{color:var(--mut);font-size:14px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.kp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.kp b{font-family:Georgia,serif;font-size:30px;display:block;line-height:1}.kp small{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f0e8de;font-size:14px}.li:first-of-type{border-top:0}.li small{color:var(--mut)}
.d{white-space:nowrap;font-weight:700}
.empty{color:var(--mut);font-size:14px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th{text-align:start;background:var(--sand);padding:9px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
td{border-top:1px solid #eee3d8;padding:7px 8px;vertical-align:top}
td.n{font-weight:700;color:#8a7a68;width:52px}td.dep{font-size:12px;color:#8a7a68;min-width:140px}
input[type=date],select.s,input.c{font:inherit;padding:7px;border:1px solid #cbbfb0;border-radius:6px;background:#fff;max-width:100%}
input.c{width:100%;min-width:150px}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.p-af{background:#eee;color:#555}.p-ec{background:#e3edfb;color:var(--blu)}.p-t{background:#e3f4e8;color:var(--grn)}.p-b{background:#fde5e3;color:var(--red)}
.late td.dl{color:var(--red);font-weight:700}.ok{color:var(--grn);font-size:12px;margin-inline-start:6px;opacity:0;transition:opacity .3s}.ok.show{opacity:1}
.tl{font-size:12px;color:var(--mut);font-style:italic;margin-top:3px}.tl:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.pc b{font-size:15px}
.bar{height:8px;background:#eee3d8;border-radius:5px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.pc small{display:block;color:var(--mut);margin-top:3px}.red{color:var(--red);font-weight:600}.amb{color:#a46b00;font-weight:600}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.filters select{padding:8px;border:1px solid #cbbfb0;border-radius:8px;font:inherit;background:#fff}
.hint{color:var(--mut);font-size:14px;margin:0 0 12px;line-height:1.5}.scroll{overflow-x:auto}
/* gantt */
.gw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:75vh}
.gh{position:sticky;top:0;z-index:6;background:#fff}
.gl{position:sticky;left:0;z-index:4;width:290px;min-width:290px;background:#fff;border-inline-end:1px solid var(--line);padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;unicode-bidi:plaintext;text-align:start;font-size:13px}
.gr{display:flex;height:30px;align-items:center;border-top:1px solid #f3ece3;position:relative;z-index:2}
.gr.ph{background:#fbf8f4;font-weight:700;cursor:pointer;height:36px}.gr.ph .gl{background:#fbf8f4}
.gt{position:relative;height:100%;flex:none}
.gmo{display:flex;height:24px;border-bottom:1px solid var(--line)}.gmo div,.gdy div{flex:none;font-size:11px;color:var(--mut);text-align:center;border-inline-start:1px solid #f0e8de;overflow:hidden;white-space:nowrap}
.gmo div{font-weight:700;color:var(--ink);text-align:start;padding:5px 6px;text-transform:capitalize}.gdy{display:flex;height:22px;line-height:22px}
.gdy div.we,.we-bg{background:rgba(176,122,60,.09)}
.gov{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none}.gov i{position:absolute;top:0;bottom:0;background:rgba(176,122,60,.07)}
.gov b{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:3}
.gbar{position:absolute;top:7px;height:16px;border-radius:5px;display:flex;align-items:center;font-size:10px;color:#fff;padding:0 4px;overflow:hidden}
.gbar.af{background:#a9b6c9}.gbar.ec{background:var(--blu)}.gbar.t{background:#6cb585}.gbar.b{background:var(--red)}.gbar.lt{box-shadow:0 0 0 2px var(--red)}
.gbar.sum{top:11px;height:14px;background:#d8c8b3;border-radius:4px}.gbar.sum i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.gms{position:absolute;top:8px;width:14px;height:14px;background:var(--gold);transform:rotate(45deg);border-radius:2px}
.gbl{position:absolute;top:7px;font-size:11px;color:var(--mut);white-space:nowrap;line-height:16px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 10px;align-items:center}.leg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}


body.cvr header,body.cvr footer{display:none}body.cvr main{padding:0;max-width:none}
.cover{min-height:100vh;gap:10px;background:radial-gradient(circle at 50% 35%,#5D281A 0%,#3E211B 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;color:#F8DAB8;gap:14px}
.cv-logo{width:min(330px,70vw);height:auto}.cv-rule{width:90px;height:2px;background:#F7AA54;margin:10px 0}
.cv-t{font-family:'Cormorant Garamond',Georgia,"Noto Naskh Arabic",serif;font-weight:600;font-size:clamp(32px,5.2vw,54px);letter-spacing:.04em;margin:0;color:#F8DAB8}
.cv-s{margin:0;font-size:15px;line-height:1.7;opacity:.85;letter-spacing:.04em}
.cv-b{margin-top:22px;background:#F7AA54;color:#3E211B;border:0;border-radius:999px;padding:13px 44px;font:600 15px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.cv-b:hover{background:#F8DAB8}
.cv-f{margin-top:30px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.55}

.cvp{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,2vw,22px);width:min(980px,94vw);margin-top:14px}
.pv em{font-style:normal;font-weight:500;font-size:11.5px;opacity:.7;margin-top:-6px}
.pv{background:transparent;border:0;cursor:pointer;color:#F8DAB8;font:600 14px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:9px;padding:8px 2px;border-radius:16px;transition:transform .15s,background .15s}
.pv svg{width:clamp(88px,12vw,118px);height:auto;border-radius:50%;box-shadow:0 0 0 3px rgba(247,170,84,.25);transition:box-shadow .15s}
.pv:hover{transform:translateY(-3px)}.pv:hover svg{box-shadow:0 0 0 3px #F7AA54}
.pv.on svg{box-shadow:0 0 0 4px #F7AA54,0 8px 24px rgba(0,0,0,.35)}.pv.on{background:transparent}
.pv.dim{opacity:.45}
.cvp.g4{grid-template-columns:repeat(4,1fr);width:min(760px,94vw)}.cvp.g5{grid-template-columns:repeat(5,1fr);width:min(900px,94vw)}.cvp.g3{grid-template-columns:repeat(3,1fr);width:min(620px,94vw)}
@media(max-width:700px){.cvp.g4{grid-template-columns:repeat(2,1fr);width:min(340px,94vw)}.cvp.g5{grid-template-columns:repeat(3,1fr);width:min(360px,94vw)}.cvp.g3{grid-template-columns:repeat(3,1fr)}}
.cv-back{background:transparent;border:1px solid rgba(247,170,84,.5);color:#F8DAB8;border-radius:999px;padding:7px 18px;margin-top:10px;font:600 13px Inter,sans-serif;cursor:pointer;transition:background .2s,color .2s}.cv-back:hover{background:rgba(247,170,84,.18);color:#F7AA54}
.pv{position:relative;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .2s,opacity .25s}
.pv svg{transform:perspective(520px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--s,1));transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .25s;will-change:transform}
.pv svg image{transform-box:fill-box;transform-origin:center;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pv:hover,.pv:focus-visible{transform:none;--s:1.09}
.pv:hover svg,.pv:focus-visible svg{box-shadow:0 0 0 3px #F7AA54,0 14px 34px rgba(0,0,0,.5),0 0 30px rgba(247,170,84,.35)}
.pv:hover svg image,.pv:focus-visible svg image{transform:scale(1.1)}
.pv:active{--s:.95}.pv:active svg{transition-duration:.08s}
.pv:focus-visible{outline:2px solid #F7AA54;outline-offset:2px}
.pv span{transition:color .2s,letter-spacing .2s}.pv:hover span{color:#F7AA54}
.pv.on{--s:1.1}.pv.on svg{animation:pvglow 2.4s ease-in-out infinite}.pv.on span{color:#F7AA54}.pv.on em{opacity:1}
@keyframes pvglow{0%,100%{box-shadow:0 0 0 4px #F7AA54,0 0 18px rgba(247,170,84,.35)}50%{box-shadow:0 0 0 4px #F7AA54,0 0 38px rgba(247,170,84,.75)}}
@keyframes pvin{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.cvp.an .pv{animation:pvin .6s cubic-bezier(.2,.8,.2,1) both}
.cvp.an .pv:nth-child(2){animation-delay:.07s}.cvp.an .pv:nth-child(3){animation-delay:.14s}.cvp.an .pv:nth-child(4){animation-delay:.21s}.cvp.an .pv:nth-child(5){animation-delay:.28s}.cvp.an .pv:nth-child(6){animation-delay:.35s}
@media(prefers-reduced-motion:reduce){.pv,.pv svg,.pv svg image{transition:none!important}.pv.on svg,.cvp.an .pv{animation:none!important}}
.pin{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pin input{padding:13px 18px;border:0;border-radius:999px;font:600 18px Inter,sans-serif;letter-spacing:.18em;text-align:center;width:210px;background:#F8DAB8;color:#3E211B}
.pin .cv-b{margin:0}.pe{color:#ffb4ab;min-height:20px;margin-top:8px;font-size:14px}
@media(max-width:700px){.cvp{grid-template-columns:repeat(3,1fr)}.cv-logo{width:min(300px,70vw)}}
.vs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px 6px;align-items:start;justify-items:center;margin:0 0 14px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:16px}
.vs small{grid-column:1/-1;justify-self:start;width:100%;color:var(--mut);font-size:12.5px}
.vs button{width:100%;text-align:center;line-height:1.25;background:transparent;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font:600 12px inherit;color:var(--ink);padding:5px 7px;border-radius:12px;opacity:.7}
.vs button svg{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 2px transparent}
.vs button.on{opacity:1;background:#fdf1de}.vs button.on svg{box-shadow:0 0 0 3px #d9a85b}.vs button:hover{opacity:1}
#mdl{display:none;position:fixed;inset:0;background:rgba(30,18,12,.6);z-index:50}
#mdl .mb{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#mdl .mc{background:#fff;border-radius:18px;padding:24px;width:min(420px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35)}
#mdl h3{margin:0 0 6px;font-family:Georgia,serif}#mdl p{margin:0 0 12px;color:var(--mut);font-size:14px}

.vs .rb{margin-inline-start:auto;align-self:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:600 13px inherit;cursor:pointer;opacity:1}

#mdl .ph{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}#mdl .ph svg{width:56px;height:56px;border-radius:50%}

.pv img,.pv svg image{border-radius:50%}
.cvl{display:flex;border:1px solid #F7AA54;border-radius:999px;overflow:hidden;margin-top:26px}.cvl button{background:transparent;border:0;padding:5px 13px;font:600 11px Inter,sans-serif;letter-spacing:.08em;color:#F8DAB8;cursor:pointer}.cvl button.on{background:#F7AA54;color:#3E211B}

.gcard h1{font-family:Georgia,"Noto Naskh Arabic",serif;font-weight:400;font-size:clamp(28px,5vw,40px);margin:10px 0 6px;line-height:1.1}

.gcard .err{color:#ffb4ab}
.alert{background:#fff7e8;border:1px solid #ecd3a3;border-radius:12px;padding:14px 16px;margin-bottom:16px}

.b2nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.b2nav button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}.b2nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}

 const sig=T.map(t=>t.id+(st(t.id).deadline||'')+st(t.id).status+t.e).join('');if(_coh&&_cohKey===sig)return _coh;
 const td=today(),by=new Map(T.map(t=>[t.id,t])),out=[];
 const eEnd=t=>st(t.id).deadline||t.e,dn=t=>st(t.id).status==='Terminé';
 const opn={};T.forEach(t=>{if(/OP$/.test(t.id))opn[t.p]=eEnd(t)});
 const addDays=(d,n)=>{const x=new Date(U(d)+n*864e5);return x.getUTCFullYear()+'-'+pad(x.getUTCMonth()+1)+'-'+pad(x.getUTCDate())};
 T.forEach(t=>{const x=st(t.id),d=x.deadline;if(dn(t))return;
  const base={id:t.id,o:t.o,t:t.id+' '+'§'};const P=o=>Object.assign({tid:t.id,t:t.id,s:fd(t.s),d:fd(d)},o);

  if(d&&d<td)out.push({id:t.id,o:t.o,kind:'late',sev:'e',p:{t:t.id,d:fd(d)}});
  if(d)(t.dep||'').split(',').map(z=>z.trim()).filter(Boolean).forEach(q=>{const pq=by.get(q);if(!pq||dn(pq))return;const pe=eEnd(pq);if(pe>d)out.push({id:t.id,o:t.o,kind:'before',sev:'e',p:{t:t.id,d:fd(d),q:q,qn:pq,qe:fd(pe)}})});

function mntView(){if(!me)return loginView();
 if(!MT.ok){loadMt().then(render);return `<div class="card">…</div>`}
 if(MT.err)return `<div class="card"><p class="hint">${LX('Maintenance indisponible pour le moment. Réessaie dans un instant.','Maintenance is not available right now. Please retry shortly.','الصيانة غير متاحة حاليًا. أعد المحاولة بعد قليل.')}</p></div>`;
 const td=today(),ed=mtEd(),late=MT.rows.filter(mtLate).length,soon=MT.rows.filter(r=>{const d=mtDue(r);return d&&d>=td&&dd(d,td)<=7}).length,nod=MT.rows.filter(r=>r.kind!=='snag'&&!mtDue(r)).length,sgO=MT.rows.filter(r=>r.kind==='snag'&&r.status!=='fait').length;
 const flt=[['all',LX('Tout','All','الكل')],['late',LX('En retard','Late','متأخر')],['soon',LX('7 jours','7 days','7 أيام')]].concat(Object.keys(MKIND).filter(k=>MT.rows.some(r=>r.kind===k)).map(k=>[k,MKIND[k][0]+' '+mkL(k)]));
 let rows=MT.rows.filter(r=>r.kind!=='snag').filter(r=>MT.f==='all'||(MT.f==='late'&&mtLate(r))||(MT.f==='soon'&&(d=>d&&d>=td&&dd(d,td)<=7)(mtDue(r)))||r.kind===MT.f).sort((a,b)=>(mtDue(a)||'9999')<(mtDue(b)||'9999')?-1:1);
 return `<div class="kpis">${[[LX('En retard','Late','متأخر'),late,late?'amb':''],[LX('Cette semaine','This week','هذا الأسبوع'),soon,''],[LX('Sans date','No date','بلا تاريخ'),nod,''],[LX('Snags ouverts','Open snags','ملاحظات مفتوحة'),sgO,sgO?'amb':''],[LX('Visites','Visits','الزيارات'),MT.rows.filter(r=>r.kind!=='snag').length,'']].map(([k,v,c])=>`<div class="kp"><b class="${c}">${v}</b><small>${k}</small></div>`).join('')}</div>
 ${mtBanner()}<div class="card"><div class="filters">${flt.map(([k,l])=>`<button class="btn${MT.f===k?' on':''}" onclick="MT.f='${k}';render()">${l}</button>`).join('')}${ed?`<select style="margin-inline-start:auto" onchange="if(this.value){mtAddRow(this.value);this.value=''}"><option value="">＋ ${LX('Ajouter une visite','Add a visit','إضافة زيارة')}</option>${Object.keys(MKIND).map(k=>`<option value="${k}">${MKIND[k][0]} ${esc(mkL(k))}</option>`).join('')}</select>`:''}</div>
 ${rows.length?rows.map(mtRow).join(''):`<p class="hint">${LX('Aucune visite planifiée. Ajoute les frigos (n°), le pest control, la maintenance… avec la date de dernière visite et la fréquence : l\'alarme se déclenche dès que la date est dépassée.','No visit scheduled yet. Add fridges (no.), pest control, maintenance… with last visit date and frequency: the alarm fires as soon as the date is passed.','لا توجد زيارات مجدولة. أضف الثلاجات (الأرقام) ومكافحة الحشرات والصيانة… مع تاريخ آخر زيارة والتكرار: يعمل التنبيه فور تجاوز الموعد.')}</p>`}
 ${ed?'':`<p class="hint">${LX('Lecture seule.','Read only.','للقراءة فقط.')}</p>`}</div>${snagView()}`}
async function emSave(id){const row=document.getElementById('em-'+id);if(!row)return;const g=c=>row.querySelector('.'+c).value;
 const line={id,area:g('e-ar'),issue:g('e-is'),name:g('e-nm'),role:g('e-rl'),phone:g('e-ph'),backup_name:g('e-bn'),backup_phone:g('e-bp'),note:g('e-nt')};
 try{const r=await rpc('emg_save',{p_who:me.who,p_pin:me.pin,p_line:line});const i=EM.rows.findIndex(z=>z.id===id);if(i>=0)EM.rows[i]=r;const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render()}catch(e){alert(LX('Enregistrement impossible.','Could not save.','تعذر الحفظ.'))}}
async function emAdd(k){try{const r=await rpc('emg_save',{p_who:me.who,p_pin:me.pin,p_line:{area:k||'other'}});EM.rows.push(r);render()}catch(e){alert(LX('Ajout impossible.','Could not add.','تعذرت الإضافة.'))}}
async function emDel(id){if(!confirm(LX('Supprimer ce contact ?','Delete this contact?','حذف جهة الاتصال؟')))return;try{await rpc('emg_del',{p_who:me.who,p_pin:me.pin,p_id:id});EM.rows=EM.rows.filter(z=>z.id!==id);render()}catch(e){}}

function emRow(r){if(!mtEd())return `<div class="card" style="padding:12px 14px;margin:8px 0"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><span><b>${esc(r.name)||'—'}</b>${r.role?' · <small class="hint">'+esc(r.role)+'</small>':''}${r.issue?'<br><small class="hint">'+esc(r.issue)+'</small>':''}</span>${tel(r.phone)}</div>${r.backup_name||r.backup_phone?`<div class="hint" style="margin-top:4px">${LX('Remplaçant','Backup','البديل')} : ${esc(r.backup_name)} ${tel(r.backup_phone)}</div>`:''}${r.note?`<div class="hint">${esc(r.note)}</div>`:''}</div>`;
 const o=Object.keys(EAREA).map(k=>`<option value="${k}"${k===r.area?' selected':''}>${esc(eaL(k))}</option>`).join('');

  <input class="e-ph" type="tel" placeholder="${LX('Téléphone','Phone','الهاتف')}" value="${esc(r.phone)}" maxlength="60" onchange="emSave('${r.id}')">
  <input class="e-bn" placeholder="${LX('Remplaçant','Backup','البديل')}" value="${esc(r.backup_name)}" maxlength="120" onchange="emSave('${r.id}')">
  <input class="e-bp" type="tel" placeholder="${LX('Tél. remplaçant','Backup phone','هاتف البديل')}" value="${esc(r.backup_phone)}" maxlength="60" onchange="emSave('${r.id}')">

async function trChunks(t,to){const parts=[];let cur='';t.split(/(?<=[.!?\n])\s*/).forEach(x=>{if((cur+' '+x).length>450&&cur){parts.push(cur);cur=x}else cur=cur?cur+' '+x:x});if(cur)parts.push(cur);const o=[];
 for(const c of parts.flatMap(c=>c.length>450?c.match(/.{1,450}/gs):[c])){const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(c)+'&langpair=fr|'+to);const j=await r.json();if(!j.responseData)throw 0;o.push(j.responseData.translatedText)}return o.join(' ')}

function ambPlay(k){const x=AMBL.find(y=>y[0]===(k||AMB.sel))||AMBL[0],srcs=ambSrc(x);let n=0;if(AMB.a){try{AMB.a.pause()}catch(e){}}const a=new Audio();a.loop=true;a.volume=AMB.vol;a.preload='auto';AMB.a=a;AMB.err=false;
 const go=()=>{if(n>=srcs.length){AMB.err=true;AMB.on=false;ambUi();return}a.src=srcs[n++];a.play().then(()=>{AMB.on=true;ambSave();ambUi()}).catch(()=>{})};a.onerror=go;go()}
